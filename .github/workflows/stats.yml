name: Update GitHub language stats

on:
  # Run automatically every Sunday at 03:00 UTC
  schedule:
    - cron: "0 3 * * 0"

  # Allow manual execution from the GitHub Actions tab
  workflow_dispatch:

jobs:
  update-language-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # Checkout profile repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Generate language statistics
      - name: Generate Top Languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=JanESchneider&layout=compact&langs_count=10&theme=github_dark&hide_border=true&hide=D
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      # Commit generated SVG
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/top-langs.svg
          git commit -m "Update language stats" || exit 0
          git push