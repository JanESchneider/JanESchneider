name: Update GitHub language stats

on:
  # Run automatically every Sunday at 03:00 UTC
  schedule:
    - cron: "0 3 * * 0"

  # Allow manual execution from the GitHub Actions tab
  workflow_dispatch:

jobs:
  update-language-stats:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # Checkout profile repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Install dependencies
      - name: Install dependencies
        run: |
          pip install requests

      # Generate language statistics
      - name: Generate Top Languages card
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          python scripts/generate_language_stats.py

      # Commit generated SVG
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/top-langs.svg

          git diff --cached --quiet && exit 0

          git commit -m "Update language stats"
          git push